  <text x="134" y="488" fill="#344154" font-family="Arial, sans-serif" font-size="19">1. Identify affected assets and versions.</text>
  <text x="134" y="526" fill="#344154" font-family="Arial, sans-serif" font-size="19">2. Apply vendor security update quickly.</text>
  <text x="134" y="564" fill="#344154" font-family="Arial, sans-serif" font-size="19">3. Restrict exposure while patching.</text>

